name: ci
on:
  pull_request:
  push:
    branches: ['jog-merge/**', 'jog-merge-tmp/**', main]
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: echo "tree $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
      - run: if [ -e SLOW ]; then sleep 120; else sleep 20; fi
      - run: test ! -e FAIL
